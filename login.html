<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Login — SmartEdu</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="hero-bg">
    <div class="hero-blob blob-1"></div>
    <div class="hero-blob blob-2"></div>
    <div class="hero-blob blob-3"></div>
  </div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div style="width:60px;height:60px;background:var(--gradient);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#fff;margin:0 auto 14px;box-shadow:0 8px 24px rgba(99,102,241,0.4);">
          <i class="fas fa-book-open"></i>
        </div>
        <div style="font-size:1.6rem;font-family:'Poppins',sans-serif;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;">SmartEdu</div>
      </div>

      <h2 class="auth-title">Welcome Back!</h2>
      <p class="auth-sub">Sign in to continue your learning journey</p>

      <div class="social-auth">
        <button class="social-auth-btn" onclick="showToast('Google login coming soon!','info')">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#EA4335" d="M9 3.48c1.69 0 2.83.73 3.48 1.34l2.54-2.48C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l2.91 2.26C4.6 5.05 6.62 3.48 9 3.48z"/><path fill="#4285F4" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#FBBC05" d="M3.88 10.78A5.54 5.54 0 0 1 3.58 9c0-.62.11-1.22.29-1.78L.96 4.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.04l2.92-2.26z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.4-1.57-5.12-3.74L.97 13.04C2.45 15.98 5.48 18 9 18z"/></svg>
          Continue with Google
        </button>
        <button class="social-auth-btn" onclick="showToast('Microsoft login coming soon!','info')">
          <i class="fab fa-microsoft" style="color:#00a4ef;font-size:1.1rem;"></i> Microsoft
        </button>
      </div>

      <div class="auth-divider"><span>or sign in with email</span></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email / Roll Number</label>
          <div class="input-icon-wrap">
            <i class="input-icon fas fa-user"></i>
            <input class="form-control" type="text" id="loginEmail" placeholder="student@college.edu or 21CS001" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" style="display:flex;justify-content:space-between;align-items:center;">
            Password
            <a href="#" style="color:var(--primary);font-weight:500;font-size:0.82rem;">Forgot password?</a>
          </label>
          <div class="input-icon-wrap" style="position:relative;">
            <i class="input-icon fas fa-lock"></i>
            <input class="form-control" type="password" id="loginPass" placeholder="Enter your password" />
            <i class="password-toggle fas fa-eye" onclick="togglePass('loginPass', this)"></i>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Sign in as</label>
          <select class="form-control" id="loginRole">
            <option value="student">🎓 Student</option>
            <option value="faculty">👨‍🏫 Faculty</option>
            <option value="admin">🏢 Administrator</option>
          </select>
        </div>
        <div class="checkbox-group" style="margin-bottom:20px;">
          <input type="checkbox" id="rememberMe" checked />
          <label for="rememberMe">Keep me signed in for 30 days</label>
        </div>
        <button type="submit" class="btn-primary btn-full">
          <i class="fas fa-sign-in-alt"></i> Sign In to SmartEdu
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one for free →</a>
      </div>

      <!-- DEMO HINT -->
      <div style="margin-top:20px;padding:12px 16px;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.2);border-radius:10px;font-size:0.82rem;color:var(--text-muted);text-align:center;">
        <i class="fas fa-info-circle" style="color:var(--primary-light);margin-right:6px;"></i>
        Students can register for an account. Faculty accounts are created by the administrator.
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const identifier = document.getElementById('loginEmail').value.trim();
      const password   = document.getElementById('loginPass').value;

      if (!identifier || !password) {
        showToast('Email/Roll no aur password daalo!', 'error'); return;
      }

      const btn = e.target.querySelector('button[type="submit"]');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
      btn.disabled = true;

      sessionStorage.removeItem('smartedu_user');
      const r = await Auth.login(identifier, password);

      if (r.ok && r.data.user.role === document.getElementById('loginRole').value) {
        // Auth.login stores the authenticated account.
        showToast('Welcome back, ' + r.data.user.name.split(' ')[0] + '! 🎉', 'success');
        setTimeout(() => {
          window.location.href = r.data.user.role === 'admin' ? 'admin.html' : r.data.user.role === 'faculty' ? 'faculty.html' : 'dashboard.html';
        }, 900);
      } else if (r.ok) {
        sessionStorage.removeItem('smartedu_user');
        showToast('This account does not have the selected role.', 'error');
      } else {
        showToast(r.error || 'Login failed. Please check your details and try again.', 'error');
      }

      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In to SmartEdu';
      btn.disabled = false;
    }
    function togglePass(id, el) {
      const inp = document.getElementById(id);
      if (inp.type === 'password') {
        inp.type = 'text';
        el.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        inp.type = 'password';
        el.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }
  </script>
</body>
</html>
